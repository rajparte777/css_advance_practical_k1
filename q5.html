<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
             background-color: rgb(229, 248, 187);
        }
        .container{
             margin-top: 200px;
 

        }
        .boxes{
            height: 50vh;
            background-color: grey;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .box1{
            width: 130px;
            height: 130px;
            border: 7px solid red;
            outline:7px solid black;
            background-color: rgb(240, 193, 136);
            padding: 20px;
            font-size: 18px;
            font-weight: 600;
           
        }
        .box2{
            width: 180px;
            height: 180px;
            border: 6px dotted rgb(71, 79, 242);
            outline:8px solid rgb(232, 61, 61);
            background-color: rgb(66, 251, 140);
             padding: 26px;
            font-size: 28px;
            font-weight: 400;
        }
        .box3{
            width: 220px;
            height: 220px;
            border: 7px dashed rgb(52, 11, 11);
            outline: 10px  double rgb(2, 247, 247);
            background-color: rgb(159, 74, 238);
             padding: 36px;
            font-size: 24px;
          
        }



    </style>
</head>
<body>
    

    <div class="container">
        <div class="boxes">
            <div class="box1"> Box 1</div>
            <div class="box2"> Box 2</div>
            <div class="box3">Box 3</div>

        </div>
    </div>
</body>
</html>
