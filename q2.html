<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        body{
            
        }
        
        .container img{
            width: 100%;
            

        }
        .container{
            width: 100%;
            position: relative;
           
        }
        .info{
            width: 800px;
              position: absolute;
              top: 30%;
              left: 26%;
        }
        h2{
            margin: 32px;
            font-size: 74px;
            font-weight: bolder;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            letter-spacing: 1.5;
            color: white;

        }
        p{
            color: white;
            font-size: 24px;
            font-weight: 500;
        }
        Button{
            background-color: greenyellow;
            border: 2px solid rgb(16, 15, 15);
            border-radius: 16px;
            font-size: 16px;
            padding: 8px 12px;
            margin-top: 24px;
            font-weight: 500;
        }
        button:hover{
            transition: transform 5s ease;
           transform: translateY(-5px);
            background-color:rgb(57, 193, 230) ;
            color: whitesmoke;


        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./img/mahabaleshwar.png" alt="">
   
    <div class="info">
        <center><h2>Mahabaleshwar</h2></center>
        <p>Mahabaleshwar is a famous hill station in the Western Ghats of Maharashtra, India. Set at 1,372 meters above sea level, it is known for its cool weather, lush green valleys, and vast strawberry farms. </p>
          <center><Button>Learn More</Button></center>
    </div>
 </div>
</body>
</html>
