<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        body{
            
        }
        
        .container video{
            width: 100%;
            

        }
        .container{
            width: 100%;
            position: relative;
           
        }
        .info{
            width: 900px;
              position: absolute;
              top: 25%;
              left: 26%;
        }
        h2{
            margin: 42px 0;
            font-size: 74px;
            font-weight: bolder;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            letter-spacing: 1.5;
            color: white;

        }
        p{
            color: white;
            font-size: 24px;
            font-weight: 500;
            font-family: Arial, Helvetica, sans-serif;
        }
        Button{
            background-color: rgb(68, 100, 218);
            border: 2px solid rgb(16, 15, 15);
            border-radius: 12px;
            font-size: 18px;
            padding: 12px 16px;
            margin-top: 24px;
            font-weight: 700;
            color: whitesmoke;
        }
        button:hover{
            transition: transform 5s ease;
           transform: translateY(-5px);
            background-color:rgb(57, 193, 230) ;
            color: whitesmoke;


        }
    </style>
</head>
<body>
    <div class="container">
        <video src="./video/mustangcar.mp4" autoplay muted loop></video>
   
    <div class="info">
        <center><h2>Experience the Mustang</h2></center>
<p>
     Step inside the legendary Mustang and experience premium comfort, powerful performance, and iconic design.
</p>          <center><Button>Learn More</Button></center>
    </div>
 </div>
</body>
</html>
