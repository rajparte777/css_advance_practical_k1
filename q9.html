<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;

        }
        nav{
            background-color: darkslategray;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
       position: sticky;
       top: 0;
       z-index: 1;
        }
        nav a{
                  color: white;
            font-size: 18px;
            text-decoration: none;
        }
        
        .home{
           background-color: #b0eeb5;
           font-size: 48px;
           color: rgb(196, 117, 225);
           font-weight: bolder;
           text-align: center;
           height: 50vh;
            padding-top: 100px;
        }
        .about{
            background-color: rgb(252, 195, 205);
             font-size: 48px;
           color: rgb(247, 247, 243);
           font-weight: bolder;
           text-align: center;
            height: 50vh;
             padding-top: 100px;
        }
        .Product{
            background-color: rgb(195, 252, 252);
             font-size: 48px;
           color: rgb(216, 129, 129);
           font-weight: bolder;
           text-align: center;
            height: 50vh;
            padding-top: 100px;
        }

    </style>
</head>
<body>
     <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Products</a>
        <a href="">Contact</a>
    </nav>
    <div class="home">Home  </div>
    <div class="about">About  </div>
    <div class="Product">Product  </div>
    
</body>
</html>
