<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
box-sizing: border-box;
margin: 0;
    }
    .container{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
        background-color: coral;
        
    }
    .card{
        background-color: khaki;
        width: 500px;
        border-radius:18px;
       box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
        padding: 18px 0;
    }
    .img{
           border-radius: 50%;
           margin: 12px 0;
       
           width: 200px;
           background-color: aqua;
           margin:16px auto;
           
    }
    img{
        width: 100%;
    }
    h2{
        margin: 16px 0;
      text-shadow: 5px 5px 10px rgb(235, 39, 111);
       font-size: 32px;
       font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    h3{
        text-decoration: wavy underline rgb(113, 128, 231);
        margin: 16px ;
        font-size: 18px;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }
    p{
        margin: 18px;
        padding: 0 12px;
        text-transform: capitalize;
        font-size: 18px;
        font-style: italic;
    }
   
    hr {
    border: none;
    height: 1.5px;
    background-color: rgb(22, 22, 23);
    width: 80%;
    margin: 28px auto;

}
   

    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="img">
               <center> <img src="./img/student.webp" alt=""></center>
            </div>
            <center><h2>Tom Curren</h2></center>
            <hr>
            <center><h3>B.E.Computer Engineering</h3></center>
           <center> <p> A passionate computer engineering student interested in
            Java, Spring Boot, web development, and software engineering.</p></center>

        </div>
    </div>
</body>
</html>
