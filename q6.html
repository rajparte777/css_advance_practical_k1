<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            box-sizing: border-box;
        }
        body{
                       background-color: #9edba3;
                       width: 100%;
        }
        .container{
            background-color: #9edba3;
           /* background-color: #f3e5f5; */
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap:wrap ;
            
        }
        .box{
            width: 250px;
    background-color: #f2ccf8; 
    border: 1px solid #444141;
            margin:24px 70px;
            border-radius: 12px;
            box-shadow: rgba(60, 64, 67, 0.3) 0px 1px 2px 0px, rgba(60, 64, 67, 0.15) 0px 2px 6px 2px;
        }
        img{
            width: 100%;
            background-color: cadetblue;
            border-radius: 12px 12px  0 0;
        }
        h3{
            margin: 12px;
            font-size: 24px; 
            font-weight: 600;
            letter-spacing: 1px;

        }
        p{
            font-size: 17px;
            margin: 8px 0;
            color: red;
        }
        .box6 img{
            height: 212px;
            order: 4;

        }
        .box5 img{
            height: 212px;
              order: 1;

        }
        .box4 img{
            height: 212px;

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="./img/mobile.png" alt="">
            <center><h3>Mobile</h3></center>
        <center><p>Prize : 20000</p></center>
        </div>
         
        <div class="box">
            <img src="./img/watch.webp" alt="">
            <center><h3>Watch</h3></center>
        <center><p>Prize : 2,000</p></center>
        </div>

        <div class="box">
            <img src="./img/camera.jpg" alt="">
            <center><h3>Camera</h3></center>
        <center><p>Prize : 2,35,000</p></center>
        </div>

        <div class="box box6">
            <img src="./img/sneaker.webp" alt="">
            <center><h3>Sneaker</h3></center>
        <center><p>Prize : 18,000</p></center>
        </div>

        <div class="box box5">
            <img src="./img/laptop.webp" alt="">
            <center><h3>laptop</h3></center>
        <center><p>Prize : 54,000</p></center>
        </div>

        <div class="box box6">
            <img src="./img/headphone.jpg" alt="">
            <center><h3>HeadPhones</h3></center>
        <center><p>Prize : 13,999</p></center>
        </div>

        
     
    </div>
    
</body>
</html>
