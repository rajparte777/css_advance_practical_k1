<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
        }
        div{
            width: 100%;
          height: 100vh;         
          display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(171, 240, 245);
        }
        h1{
            font-size: 72px;
            font-weight: bolder;
            color: rgb(80, 19, 19);
        }
        @media (max-width:500px){
            div{
            width: 100%;
          height: 100vh;         
          display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(255, 227, 172);
        }
        h1{
            font-size: 54px;
            font-weight: bolder;
            color: rgb(80, 19, 19);
            margin-left: 30px;
        }
        
        }

        @media (min-width:700px){
            div{
            width: 100%;
          height: 100vh;         
          display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(237, 181, 252);
        }
        h1{
            font-size: 54px;
            font-weight: bolder;
            color: rgb(77, 14, 14);
            margin-left: 30px;
        }
    }
    </style>
</head>
<body>
    <div>
        <h1>Responsive Background</h1>
    </div>
    
</body>
</html>
