<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Position Example</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            background-color: rgb(160, 209, 167);
        }
        section {
            background-color: grey;
            height: 150px;
            padding: 24px;
        }
        h1 {
            font-size: 56px;
            color: white;
            text-align: center;
        }
        nav {
            background-color: darkslategray;
            width: 100%;
            height: 100px;

            display: flex;
            justify-content: space-evenly;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 10;
        }
        nav a {
            color: white;
            font-size: 18px;
            text-decoration: none;
        }
        nav a:hover {
            color: greenyellow;
        }
    
        main {
            position: relative;
            padding: 50px;
            min-height: 800px;
        }
        .container {
            background-color: #9cd7e8;

            width: 100%;

            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: wrap;

            padding: 30px;
        }

        .box {
            width: 250px;

            background-color: #f2ccf8;

            border: 1px solid #444141;
            margin: 24px;

            border-radius: 12px;

            box-shadow:
                rgba(60, 64, 67, 0.3) 0px 1px 2px 0px,
                rgba(60, 64, 67, 0.15) 0px 2px 6px 2px;
        }

        img {
            width: 100%;
            height: 200px;

            object-fit: cover;

            background-color: cadetblue;

            border-radius: 12px 12px 0 0;
        }

        h3 {
            margin: 12px;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            text-align: center;
        }

        p {
            font-size: 17px;
            margin: 8px 0 20px;
            color: red;
            text-align: center;
        }

        button {
            background-color: greenyellow;

            border: 2px solid rgb(16, 15, 15);
            border-radius: 16px;

            font-size: 16px;
            padding: 8px 12px;

            font-weight: 500;

            position: fixed;
            right: 40px;
            bottom: 30px;

            cursor: pointer;
        }

        button:hover {
            background-color: green;
            color: white;
        }
    </style>

</head>

<body>

    <section>
        <h1>Welcome</h1>
    </section>

    <nav>
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Products</a>
        <a href="">Contact</a>
    </nav>

    <main>
        <div class="container">
            <div class="box">
                <img src="./img/mobile.png" alt="Mobile">

                <h3>Mobile</h3>

                <p>Price : ₹20,000</p>
            </div>
            <div class="box">

                <img src="./img/watch.webp" alt="Watch">

                <h3>Watch</h3>

                <p>Price : ₹2,000</p>

            </div>
            <div class="box">

                <img src="./img/camera.jpg" alt="Camera">

                <h3>Camera</h3>

                <p>Price : ₹2,35,000</p>

            </div>

        </div>

        <button>Learn More</button>

    </main>

</body>

</html>
